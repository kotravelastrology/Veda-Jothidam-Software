<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Veda Jothidam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .header-subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3b82f6;
        }

        .stat-card.charts {
            border-left-color: #8b5cf6;
        }

        .stat-card.consultations {
            border-left-color: #ec4899;
        }

        .stat-card.interpretations {
            border-left-color: #14b8a6;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .stat-detail {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 18px;
            color: #1f2937;
        }

        .card-header a {
            color: #3b82f6;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
        }

        .card-header a:hover {
            color: #2563eb;
        }

        .card-content {
            padding: 20px;
        }

        /* Recent Charts */
        .charts-list {
            list-style: none;
        }

        .charts-list li {
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .charts-list li:last-child {
            border-bottom: none;
        }

        .chart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-info {
            flex: 1;
        }

        .chart-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .chart-date {
            font-size: 12px;
            color: #9ca3af;
        }

        .chart-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Consultations */
        .consultation-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid #3b82f6;
        }

        .consultation-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .consultation-date {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .consultation-status {
            display: inline-block;
            padding: 3px 8px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .consultation-status.confirmed {
            background: #dcfce7;
            color: #166534;
        }

        .consultation-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        /* Recommendations */
        .recommendations-list {
            list-style: none;
        }

        .recommendation-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid #f59e0b;
        }

        .recommendation-item.high {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .recommendation-item.low {
            border-left-color: #3b82f6;
            background: #eff6ff;
        }

        .recommendation-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .recommendation-desc {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .recommendation-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: #374151;
            font-weight: 600;
            transition: all 0.2s;
        }

        .recommendation-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        /* Activity */
        .activity-list {
            list-style: none;
        }

        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            gap: 12px;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-weight: 500;
            color: #1f2937;
            margin-bottom: 2px;
        }

        .activity-time {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .empty-state-desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        /* Error */
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                margin-top: 16px;
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Dashboard</h1>
                <p class="header-subtitle" id="welcome-message">Welcome back! 👋</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="createChart()">+ New Chart</button>
                <button class="btn btn-secondary" onclick="bookConsultation()">Book Consultation</button>
            </div>
        </div>

        <!-- Error Message (if any) -->
        <div id="error-message" class="error-message" style="display: none;"></div>

        <!-- Stats Grid -->
        <div id="stats-loading" class="loading-spinner">
            <div class="loading"></div>
        </div>
        <div id="stats-container" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card charts">
                    <div class="stat-label">📊 Birth Charts</div>
                    <div class="stat-value" id="total-charts">0</div>
                    <div class="stat-detail" id="charts-detail">0 analyzed</div>
                </div>
                <div class="stat-card consultations">
                    <div class="stat-label">📅 Consultations</div>
                    <div class="stat-value" id="total-consultations">0</div>
                    <div class="stat-detail" id="consultations-detail">0 pending</div>
                </div>
                <div class="stat-card interpretations">
                    <div class="stat-label">✨ Interpretations</div>
                    <div class="stat-value" id="total-interpretations">0</div>
                    <div class="stat-detail">All aspects analyzed</div>
                </div>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Left Column -->
            <div>
                <!-- Recent Charts -->
                <div class="card" id="recent-charts-card" style="margin-bottom: 30px;">
                    <div class="card-header">
                        <h2>Recent Charts</h2>
                        <a href="/charts">View All</a>
                    </div>
                    <div class="card-content" id="recent-charts-loading">
                        <div class="loading"></div>
                    </div>
                </div>

                <!-- Upcoming Consultations -->
                <div class="card" id="upcoming-consultations-card">
                    <div class="card-header">
                        <h2>Upcoming Consultations</h2>
                        <a href="/consultations">View All</a>
                    </div>
                    <div class="card-content" id="upcoming-consultations-loading">
                        <div class="loading"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- Recommendations -->
                <div class="card" id="recommendations-card" style="margin-bottom: 30px;">
                    <div class="card-header">
                        <h2>Recommendations</h2>
                    </div>
                    <div class="card-content" id="recommendations-loading">
                        <div class="loading"></div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <h2>Recent Activity</h2>
                    </div>
                    <div class="card-content" id="activity-loading">
                        <div class="loading"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let dashboardData = null;

        // Load dashboard on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load dashboard');
                }

                const data = await response.json();
                dashboardData = data.dashboard;

                // Update welcome message
                if (dashboardData.user.full_name) {
                    document.getElementById('welcome-message').textContent =
                        `Welcome back, ${dashboardData.user.full_name}! 👋`;
                }

                // Load stats
                loadStats();
                loadRecentCharts();
                loadUpcomingConsultations();
                loadRecommendations();
                loadActivity();

            } catch (error) {
                showError(error.message);
                console.error('Dashboard error:', error);
            }
        }

        function loadStats() {
            const stats = dashboardData.stats;

            document.getElementById('total-charts').textContent = stats.total_charts;
            document.getElementById('charts-detail').textContent =
                `${stats.analyzed_charts} analyzed`;

            document.getElementById('total-consultations').textContent = stats.total_consultations;
            document.getElementById('consultations-detail').textContent =
                `${stats.pending_consultations} pending`;

            document.getElementById('total-interpretations').textContent =
                stats.interpretations || 0;

            // Hide loading
            document.getElementById('stats-loading').style.display = 'none';
            document.getElementById('stats-container').style.display = 'block';
        }

        function loadRecentCharts() {
            const container = document.getElementById('recent-charts-loading');
            const charts = dashboardData.recent_charts;

            if (charts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-title">No Charts Yet</div>
                        <div class="empty-state-desc">Create your first birth chart to get started</div>
                        <button class="btn btn-primary" onclick="createChart()">Create Chart</button>
                    </div>
                `;
            } else {
                const chartsList = charts.map(chart => `
                    <li>
                        <div class="chart-item">
                            <div class="chart-info">
                                <div class="chart-name">${chart.name}</div>
                                <div class="chart-date">${new Date(chart.birth_date).toLocaleDateString()}</div>
                            </div>
                            <div>
                                ${chart.last_analyzed_at ? '<span class="chart-badge">✓ Analyzed</span>' : ''}
                                ${chart.is_public ? '<span class="chart-badge" style="background: #dcfce7; color: #166534; margin-left: 8px;">🌐 Public</span>' : ''}
                            </div>
                        </div>
                    </li>
                `).join('');

                container.innerHTML = `<ul class="charts-list">${chartsList}</ul>`;
            }
        }

        function loadUpcomingConsultations() {
            const container = document.getElementById('upcoming-consultations-loading');
            const consultations = dashboardData.upcoming_consultations;

            if (consultations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">No Upcoming Consultations</div>
                        <div class="empty-state-desc">Book a consultation with an expert astrologer</div>
                        <button class="btn btn-primary" onclick="bookConsultation()">Book Now</button>
                    </div>
                `;
            } else {
                const consultationsList = consultations.map(c => {
                    const date = new Date(c.scheduled_date);
                    const statusClass = c.status === 'confirmed' ? 'confirmed' : c.status === 'pending' ? 'pending' : '';
                    return `
                        <div class="consultation-item">
                            <div class="consultation-title">${c.title}</div>
                            <div class="consultation-date">${date.toLocaleDateString()} at ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            <div>
                                <span class="consultation-status ${statusClass}">${c.status.toUpperCase()}</span>
                                ${c.astrologer ? `<span style="margin-left: 8px; font-size: 12px; color: #6b7280;">with ${c.astrologer}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = consultationsList;
            }
        }

        function loadRecommendations() {
            const container = document.getElementById('recommendations-loading');

            fetch(`${API_BASE}/dashboard/recommendations`, {
                headers: {
                    'Authorization': `Bearer ${getToken()}`,
                }
            })
            .then(r => r.json())
            .then(data => {
                const recs = data.recommendations || [];

                if (recs.length === 0) {
                    container.innerHTML = `
                        <div style="padding: 20px; text-align: center; color: #6b7280;">
                            You're all set! No recommendations at this time.
                        </div>
                    `;
                } else {
                    const recsList = recs.map(rec => `
                        <div class="recommendation-item ${rec.priority}">
                            <div class="recommendation-title">${rec.title}</div>
                            <div class="recommendation-desc">${rec.description}</div>
                            <button class="recommendation-btn" onclick="handleAction('${rec.action}')">
                                Get Started →
                            </button>
                        </div>
                    `).join('');

                    container.innerHTML = recsList;
                }
            })
            .catch(error => {
                console.error('Error loading recommendations:', error);
                container.innerHTML = '<p style="color: #6b7280;">Could not load recommendations</p>';
            });
        }

        function loadActivity() {
            const container = document.getElementById('activity-loading');

            fetch(`${API_BASE}/dashboard/activity?days=7&limit=10`, {
                headers: {
                    'Authorization': `Bearer ${getToken()}`,
                }
            })
            .then(r => r.json())
            .then(data => {
                const activities = data.activities || [];

                if (activities.length === 0) {
                    container.innerHTML = `
                        <div style="padding: 20px; text-align: center; color: #6b7280;">
                            No activity this week
                        </div>
                    `;
                } else {
                    const activityList = activities.map(activity => {
                        const time = new Date(activity.timestamp);
                        const diff = Math.floor((Date.now() - time) / 1000);
                        let timeStr;

                        if (diff < 60) timeStr = 'Just now';
                        else if (diff < 3600) timeStr = `${Math.floor(diff / 60)}m ago`;
                        else if (diff < 86400) timeStr = `${Math.floor(diff / 3600)}h ago`;
                        else timeStr = `${Math.floor(diff / 86400)}d ago`;

                        const icons = {
                            'chart': '📊',
                            'calendar': '📅',
                            'sparkles': '✨',
                        };

                        return `
                            <div class="activity-item">
                                <div class="activity-icon">${icons[activity.icon] || '•'}</div>
                                <div class="activity-content">
                                    <div class="activity-title">${activity.title}</div>
                                    <div class="activity-time">${timeStr}</div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML = `<ul class="activity-list">${activityList}</ul>`;
                }
            })
            .catch(error => {
                console.error('Error loading activity:', error);
                container.innerHTML = '<p style="color: #6b7280;">Could not load activity</p>';
            });
        }

        function handleAction(action) {
            const actions = {
                'create_chart': () => window.location.href = '/charts/new',
                'book_consultation': () => window.location.href = '/consultations/book',
                'view_charts': () => window.location.href = '/charts',
                'analyze_charts': () => window.location.href = '/charts',
                'upgrade_subscription': () => window.location.href = '/subscription',
            };

            if (actions[action]) {
                actions[action]();
            }
        }

        function createChart() {
            window.location.href = '/charts/new';
        }

        function bookConsultation() {
            window.location.href = '/consultations/book';
        }

        function getToken() {
            return localStorage.getItem('access_token') || '';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';

            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>

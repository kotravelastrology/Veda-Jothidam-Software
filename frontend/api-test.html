<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veda Jothidam - API Integration Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #764ba2;
            color: white;
        }
        .btn-secondary:hover {
            background: #653a8f;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
            transform: translateY(-2px);
        }
        .response-container {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .response-container h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .response-text {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }
        .success {
            color: #27ae60;
            background: #d5f4e6;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #27ae60;
        }
        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #e74c3c;
        }
        .info {
            color: #3498db;
            background: #d6eaf8;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .button-group { grid-template-columns: 1fr; }
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-online { background: #27ae60; }
        .status-offline { background: #e74c3c; }
        .status-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Veda Jothidam - Frontend-Backend Integration Test</h1>

        <!-- System Status -->
        <div class="section">
            <h2>System Status</h2>
            <div class="status-box">
                <div id="backend-status"></div>
                <div id="database-status"></div>
                <div id="auth-status"></div>
            </div>
            <button class="btn-primary" onclick="checkSystemStatus()">Check All Status</button>
        </div>

        <!-- Authentication Section -->
        <div class="section">
            <h2>🔐 Authentication</h2>
            <div class="grid-2">
                <div>
                    <h3>Register New User</h3>
                    <div class="form-group">
                        <label for="reg-email">Email:</label>
                        <input type="email" id="reg-email" placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password (min 12 chars):</label>
                        <input type="password" id="reg-password" placeholder="SecurePass123!">
                    </div>
                    <div class="form-group">
                        <label for="reg-name">Full Name:</label>
                        <input type="text" id="reg-name" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="reg-language">Language:</label>
                        <select id="reg-language">
                            <option value="english">English</option>
                            <option value="tamil">Tamil</option>
                        </select>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="registerUser()">Register</button>
                        <button class="btn-secondary" onclick="clearAuthForm()">Clear</button>
                    </div>
                    <div id="register-response" class="response-container" style="display:none;">
                        <h4>Registration Response:</h4>
                        <div class="response-text" id="register-response-text"></div>
                    </div>
                </div>

                <div>
                    <h3>Login</h3>
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" placeholder="Password">
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="loginUser()">Login</button>
                        <button class="btn-secondary" onclick="clearLoginForm()">Clear</button>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <h4>Token Management</h4>
                        <button class="btn-success" onclick="refreshToken()">Refresh Token</button>
                        <button class="btn-danger" onclick="logoutUser()">Logout</button>
                        <button class="btn-secondary" onclick="showTokenInfo()">Show Tokens</button>
                    </div>
                    <div id="login-response" class="response-container" style="display:none;">
                        <h4>Login Response:</h4>
                        <div class="response-text" id="login-response-text"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Management Section -->
        <div class="section">
            <h2>📊 Birth Chart Management</h2>
            <div class="form-group">
                <label for="chart-name">Chart Name:</label>
                <input type="text" id="chart-name" placeholder="My Birth Chart">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="birth-date">Birth Date (YYYY-MM-DD):</label>
                    <input type="text" id="birth-date" placeholder="1990-05-15">
                </div>
                <div class="form-group">
                    <label for="birth-time">Birth Time (HH:MM:SS):</label>
                    <input type="text" id="birth-time" placeholder="14:30:00">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="birth-place">Birth Place:</label>
                    <input type="text" id="birth-place" placeholder="New York, USA">
                </div>
                <div class="form-group">
                    <label for="birth-latitude">Latitude:</label>
                    <input type="number" id="birth-latitude" placeholder="40.7128" step="0.0001">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="birth-longitude">Longitude:</label>
                    <input type="number" id="birth-longitude" placeholder="-74.0060" step="0.0001">
                </div>
                <div class="form-group">
                    <label for="birth-timezone">Timezone:</label>
                    <input type="text" id="birth-timezone" placeholder="America/New_York">
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="createChart()">Create Chart</button>
                <button class="btn-secondary" onclick="listCharts()">List My Charts</button>
                <button class="btn-secondary" onclick="clearChartForm()">Clear</button>
            </div>
            <div id="chart-response" class="response-container" style="display:none;">
                <h4>Response:</h4>
                <div class="response-text" id="chart-response-text"></div>
            </div>
        </div>

        <!-- Charts Display Section -->
        <div class="section" id="charts-section" style="display:none;">
            <h2>📋 Your Charts</h2>
            <div id="charts-list"></div>
        </div>

        <!-- Consultation Section -->
        <div class="section">
            <h2>📝 Consultation Management</h2>
            <div class="form-group">
                <label for="chart-id">Chart ID:</label>
                <input type="text" id="chart-id" placeholder="Paste chart ID here (from chart list)">
            </div>
            <div class="form-group">
                <label for="consultation-notes">Consultation Notes:</label>
                <textarea id="consultation-notes" placeholder="Write consultation notes..." rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="consultation-recommendations">Recommendations:</label>
                <textarea id="consultation-recommendations" placeholder="Astrological recommendations..." rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="consultation-remedies">Remedies:</label>
                <textarea id="consultation-remedies" placeholder="Suggested remedies..." rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="follow-up-date">Follow-up Date (YYYY-MM-DD):</label>
                <input type="text" id="follow-up-date" placeholder="2026-10-15">
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="createConsultation()">Create Consultation</button>
                <button class="btn-secondary" onclick="listConsultations()">List Consultations</button>
                <button class="btn-secondary" onclick="clearConsultationForm()">Clear</button>
            </div>
            <div id="consultation-response" class="response-container" style="display:none;">
                <h4>Response:</h4>
                <div class="response-text" id="consultation-response-text"></div>
            </div>
        </div>

        <!-- Test Results Section -->
        <div class="section">
            <h2>✅ Test Results</h2>
            <table>
                <thead>
                    <tr>
                        <th>Test</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="test-results"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Utility Functions
        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            const textElement = document.getElementById(elementId + '-text');
            element.style.display = 'block';
            textElement.innerHTML = `<div class="${isError ? 'error' : 'success'}">
${JSON.stringify(data, null, 2)}</div>`;
        }

        function getToken() {
            return localStorage.getItem('access_token');
        }

        function setTokens(accessToken, refreshToken) {
            localStorage.setItem('access_token', accessToken);
            localStorage.setItem('refresh_token', refreshToken);
        }

        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_id');
        }

        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                }
            };

            const token = getToken();
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }

            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const result = await response.json();
                return { status: response.status, data: result };
            } catch (error) {
                return { status: 0, data: { error: error.message } };
            }
        }

        // System Status Check
        async function checkSystemStatus() {
            try {
                const health = await apiCall('/health');
                const statusDiv = document.getElementById('backend-status');
                if (health.status === 200) {
                    statusDiv.innerHTML = `<div class="success"><span class="status-indicator status-online"></span>Backend: Online ✓</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="error"><span class="status-indicator status-offline"></span>Backend: Offline ✗</div>`;
                }
            } catch (error) {
                document.getElementById('backend-status').innerHTML = `<div class="error">Backend: Error - ${error}</div>`;
            }
        }

        // Authentication Functions
        async function registerUser() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const fullName = document.getElementById('reg-name').value;
            const language = document.getElementById('reg-language').value;

            if (!email || !password || !fullName) {
                alert('Please fill all fields');
                return;
            }

            const result = await apiCall('/auth/signup', 'POST', {
                email, password, full_name: fullName, language,
                timezone: 'Asia/Kolkata'
            });

            if (result.status === 201) {
                showResponse('register-response', result.data);
                setTokens(result.data.access_token, result.data.refresh_token);
                localStorage.setItem('user_id', result.data.user.id);
                alert('Registration successful!');
            } else {
                showResponse('register-response', result.data, true);
            }
        }

        async function loginUser() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('Please fill all fields');
                return;
            }

            const result = await apiCall('/auth/login', 'POST', { email, password });

            if (result.status === 200) {
                showResponse('login-response', result.data);
                setTokens(result.data.access_token, result.data.refresh_token);
                localStorage.setItem('user_id', result.data.user.id);
                alert('Login successful!');
            } else {
                showResponse('login-response', result.data, true);
            }
        }

        async function refreshToken() {
            const refreshToken = localStorage.getItem('refresh_token');
            if (!refreshToken) {
                alert('No refresh token found. Please login first.');
                return;
            }

            const result = await apiCall('/auth/refresh', 'POST', {});
            if (result.status === 200) {
                localStorage.setItem('access_token', result.data.access_token);
                alert('Token refreshed successfully!');
            } else {
                alert('Token refresh failed: ' + JSON.stringify(result.data));
            }
        }

        async function logoutUser() {
            const result = await apiCall('/auth/logout', 'POST', {});
            if (result.status === 200) {
                clearTokens();
                alert('Logged out successfully!');
            }
        }

        function showTokenInfo() {
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');
            alert(`Access Token: ${accessToken ? accessToken.substring(0, 50) + '...' : 'Not set'}\n\nRefresh Token: ${refreshToken ? refreshToken.substring(0, 50) + '...' : 'Not set'}`);
        }

        function clearAuthForm() {
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-password').value = '';
            document.getElementById('reg-name').value = '';
        }

        function clearLoginForm() {
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        // Chart Functions
        async function createChart() {
            if (!getToken()) {
                alert('Please login first');
                return;
            }

            const chartData = {
                name: document.getElementById('chart-name').value,
                birth_date: document.getElementById('birth-date').value,
                birth_time: document.getElementById('birth-time').value,
                birth_place: document.getElementById('birth-place').value,
                latitude: parseFloat(document.getElementById('birth-latitude').value),
                longitude: parseFloat(document.getElementById('birth-longitude').value),
                timezone: document.getElementById('birth-timezone').value
            };

            if (!chartData.name || !chartData.birth_date || !chartData.birth_time) {
                alert('Please fill required fields');
                return;
            }

            const result = await apiCall('/charts/create', 'POST', chartData);

            if (result.status === 201) {
                showResponse('chart-response', result.data);
                localStorage.setItem('last-chart-id', result.data.chart.id);
                document.getElementById('chart-id').value = result.data.chart.id;
                alert('Chart created successfully!');
            } else {
                showResponse('chart-response', result.data, true);
            }
        }

        async function listCharts() {
            if (!getToken()) {
                alert('Please login first');
                return;
            }

            const result = await apiCall('/charts', 'GET');

            if (result.status === 200) {
                showResponse('chart-response', result.data);

                // Display charts in table
                const chartsList = document.getElementById('charts-list');
                if (result.data.charts.length > 0) {
                    let html = '<table><thead><tr><th>Chart ID</th><th>Name</th><th>Birth Date</th><th>Location</th><th>Consultations</th><th>Action</th></tr></thead><tbody>';
                    result.data.charts.forEach(chart => {
                        html += `<tr>
<td><code>${chart.id.substring(0, 8)}...</code></td>
<td>${chart.name}</td>
<td>${chart.birth_date}</td>
<td>${chart.birth_location}</td>
<td>${chart.consultations_count}</td>
<td><button class="btn-secondary" onclick="document.getElementById('chart-id').value = '${chart.id}'">Select</button></td>
</tr>`;
                    });
                    html += '</tbody></table>';
                    chartsList.innerHTML = html;
                    document.getElementById('charts-section').style.display = 'block';
                } else {
                    chartsList.innerHTML = '<p>No charts found</p>';
                }
            } else {
                showResponse('chart-response', result.data, true);
            }
        }

        function clearChartForm() {
            document.getElementById('chart-name').value = '';
            document.getElementById('birth-date').value = '';
            document.getElementById('birth-time').value = '';
            document.getElementById('birth-place').value = '';
            document.getElementById('birth-latitude').value = '';
            document.getElementById('birth-longitude').value = '';
            document.getElementById('birth-timezone').value = '';
        }

        // Consultation Functions
        async function createConsultation() {
            if (!getToken()) {
                alert('Please login first');
                return;
            }

            const chartId = document.getElementById('chart-id').value;
            if (!chartId) {
                alert('Please select a chart first');
                return;
            }

            const consultationData = {
                notes: document.getElementById('consultation-notes').value,
                recommendations: document.getElementById('consultation-recommendations').value,
                remedies: document.getElementById('consultation-remedies').value,
                follow_up_date: document.getElementById('follow-up-date').value
            };

            const result = await apiCall(`/charts/${chartId}/consultations`, 'POST', consultationData);

            if (result.status === 201) {
                showResponse('consultation-response', result.data);
                alert('Consultation created successfully!');
            } else {
                showResponse('consultation-response', result.data, true);
            }
        }

        async function listConsultations() {
            if (!getToken()) {
                alert('Please login first');
                return;
            }

            const chartId = document.getElementById('chart-id').value;
            if (!chartId) {
                alert('Please select a chart first');
                return;
            }

            const result = await apiCall(`/charts/${chartId}/consultations`, 'GET');

            if (result.status === 200) {
                showResponse('consultation-response', result.data);
            } else {
                showResponse('consultation-response', result.data, true);
            }
        }

        function clearConsultationForm() {
            document.getElementById('consultation-notes').value = '';
            document.getElementById('consultation-recommendations').value = '';
            document.getElementById('consultation-remedies').value = '';
            document.getElementById('follow-up-date').value = '';
        }

        // Initialize on page load
        window.addEventListener('load', function() {
            checkSystemStatus();
        });
    </script>
</body>
</html>

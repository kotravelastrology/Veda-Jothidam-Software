<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1b12">
  <title>இணைப்பு இல்லை — Kotravel</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff8ed; --ink: #2b1b12; --soft: #5b4636; --line: #ecdcc0; --saffron: #c96a12; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17111c; --ink: #f3e9da; --soft: #c9b8ce; --line: #3a2d47; --saffron: #f4a94a; --card: #241b2e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
           font-family: "Noto Sans Tamil", "Nirmala UI", "Latha", system-ui, sans-serif; line-height: 1.7; }
    main { max-width: 30rem; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; padding: 2rem 1.5rem; box-shadow: 0 8px 30px -12px rgb(43 27 18 / 0.35); }
    .om { font-size: 3rem; color: var(--saffron); line-height: 1; }
    h1 { margin: 0.5rem 0 0.25rem; font-size: 1.5rem; }
    p { margin: 0.5rem 0; color: var(--soft); }
    .row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.25rem; }
    a, button { font: inherit; border-radius: 0.75rem; padding: 0.65rem 1.2rem; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
    .primary { background: var(--saffron); border-color: var(--saffron); color: #2b1b12; font-weight: 700; }
    small { display: block; margin-top: 1rem; color: var(--soft); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <div class="om" aria-hidden="true">ॐ</div>
    <h1>இணைய இணைப்பு இல்லை</h1>
    <p>பஞ்சாங்கம், ஜாதகம், தசை போன்ற ஒவ்வொரு கணக்கும் சேவையகத்தில் செய்யப்படுகிறது; அதற்கு இணைப்பு வேண்டும். இணைப்பு திரும்பியதும் மீண்டும் முயற்சிக்கவும்.</p>
    <div class="row">
      <button class="primary" type="button" onclick="location.reload()">மீண்டும் முயற்சி</button>
      <a href="/">முகப்பு</a>
    </div>
    <small>பழைய நகல்களிலிருந்து ஜாதகம் காட்டப்படுவதில்லை — காட்டுவது எப்போதும் இப்போது கணக்கிட்டதே.</small>
  </main>
</body>
</html>
